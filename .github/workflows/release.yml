name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  actions: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Validate release tag and CI
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-release-tag.sh

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew-tap:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Get source tarball SHA256
        id: sha
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output source.tar.gz \
            "https://github.com/${{ github.repository }}/archive/refs/tags/${{ steps.version.outputs.version }}.tar.gz"
          SHA=$(sha256sum source.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: marcus/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"
          FORMULA="homebrew-tap/Formula/td.rb"

          # Update URL (version in tag)
          sed -i "s|archive/refs/tags/v[0-9]*\.[0-9]*\.[0-9]*\.tar\.gz|archive/refs/tags/${VERSION}.tar.gz|" "$FORMULA"

          # Update SHA256
          sed -i "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA}\"|" "$FORMULA"

          echo "Updated $FORMULA to ${VERSION} (sha256: ${SHA})"
          cat "$FORMULA"

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/td.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "td: bump to ${{ steps.version.outputs.version }}"
          git push
