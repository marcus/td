name: Go CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - ".github/workflows/go-ci.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".golangci.yml"
      - ".github/workflows/go-ci.yml"
  # A release head is normally a docs-only commit — the changelog stamp —
  # which the path filters above skip. `make check-ci` fails closed when it
  # finds no run for the commit being released, so without a manual trigger
  # that commit is permanently unreleasable. The release gate dispatches this.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # internal/workdir's worktree tests shell out to `git commit`, which
      # needs an identity; runner images don't set one globally.
      - name: Configure git identity for tests
        run: |
          git config --global user.email "ci@td.invalid"
          git config --global user.name "td CI"

      - name: Test
        run: env -u TD_FEATURE_SYNC_AUTOSYNC -u TD_FEATURE_SYNC_CLI go test ./...

  # The test job only builds for the runner's own platform, so code that fails
  # to compile elsewhere lands silently. That happened: config.go called
  # syscall.Flock unconditionally, breaking every Windows build from ac37b22
  # until PR #79 five months later, with no CI signal in between.
  #
  # Release artifacts are darwin and linux only (see .goreleaser.yml), but
  # windows is built here too so that source builds keep working for anyone
  # on that platform.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # One job rather than a matrix: these are compile-only checks that share
      # a module cache, so looping is faster than paying cold runner startup
      # six times over.
      - name: Build for every supported platform
        run: |
          failed=""
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            echo "==> ${target}"
            if ! GOOS="${goos}" GOARCH="${goarch}" go build -o /dev/null ./...; then
              echo "::error::build failed for ${target}"
              failed="${failed} ${target}"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "Cross-platform build failed for:${failed}"
            exit 1
          fi
          echo "All target platforms built successfully."

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: golangci-lint (full codebase)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1
          args: ./...
